name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Build (gfortran, -std=f2018 -Wall -Wextra -O2)
        run: make FC=gfortran

      - name: Run test suite
        run: make test FC=gfortran
