<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bracket Root banner">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ec"/>
      <stop offset="1" stop-color="#efe7d3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#paper)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#734f96"/>
  <rect x="0" y="294" width="1200" height="6" fill="#734f96"/>
  <!-- wordmark centered -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="600" y="88" fill="#23180f" font-size="52" font-weight="700" letter-spacing="2">Bracket <tspan fill="#734f96">Root</tspan></text>
    <text x="600" y="124" fill="#5c5044" font-family="Segoe UI, Arial, sans-serif" font-size="20">native Fortran 2018 bracketed root solvers — measured, not assumed</text>
  </g>
  <!-- bracket convergence schematic -->
  <g transform="translate(150,150)">
    <!-- axes -->
    <line x1="0" y1="100" x2="900" y2="100" stroke="#8a7b66" stroke-width="2"/>
    <line x1="80" y1="10" x2="80" y2="130" stroke="#8a7b66" stroke-width="2"/>
    <!-- curve crossing zero -->
    <path d="M 100 30 C 300 15, 480 60, 620 95 S 820 138, 880 142" stroke="#23180f" stroke-width="3.5" fill="none"/>
    <!-- root -->
    <circle cx="700" cy="100" r="6" fill="#b23a48"/>
    <text x="700" y="82" fill="#b23a48" font-family="Consolas, monospace" font-size="15" text-anchor="middle">root r</text>
    <!-- bracket endpoints -->
    <line x1="140" y1="24" x2="140" y2="126" stroke="#734f96" stroke-width="2.5"/>
    <line x1="850" y1="24" x2="850" y2="126" stroke="#734f96" stroke-width="2.5"/>
    <text x="140" y="146" fill="#734f96" font-family="Consolas, monospace" font-size="16" text-anchor="middle">a</text>
    <text x="850" y="146" fill="#734f96" font-family="Consolas, monospace" font-size="16" text-anchor="middle">b</text>
    <text x="495" y="126" fill="#734f96" font-family="Consolas, monospace" font-size="15" text-anchor="middle">f(a)·f(b) &lt; 0</text>
    <!-- converging iterates -->
    <g fill="#734f96">
      <circle cx="495" cy="100" r="4.5"/>
      <circle cx="648" cy="100" r="4.5"/>
      <circle cx="684" cy="100" r="4.5"/>
      <circle cx="694" cy="100" r="4.5"/>
    </g>
    <path d="M 497 88 L 646 88" stroke="#b085c9" stroke-width="2" marker-end="url(#barr)"/>
    <defs>
      <marker id="barr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#b085c9"/>
      </marker>
    </defs>
    <text x="880" y="60" fill="#5c5044" font-family="Consolas, monospace" font-size="14" text-anchor="end">bisection · Illinois · safeguarded secant</text>
    <text x="880" y="126" fill="#8a7b66" font-family="Consolas, monospace" font-size="13" text-anchor="end">103 assertion checks</text>
  </g>
</svg>
